services:
  enterprise-dmz-exchange:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EXCHANGE_SIGNATURE_SECRET: ${EXCHANGE_SIGNATURE_SECRET:-change-me}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://internal-api:8081}
    depends_on:
      redis:
        condition: service_healthy
    networks: [dmz-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    networks: [dmz-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  dmz-network:
    driver: bridge
    internal: true
volumes:
  redis-data:
